<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente Técnico Defensivo</title>
  <link rel="manifest" href="./../static/manifest.json">
  <link rel="stylesheet" href="./../static/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>🛡️ Asistente Termux & Linux</h1>
      <p class="subtitle">Tutor defensivo y de sistemas</p>
    </header>
    
    <div class="chat-box" id="chatBox">
      <div class="message bot">
        <strong>Asistente:</strong> Sistemas listos. Pregúntame sobre comandos, redes o Linux...
      </div>
    </div>
    
    <form class="input-group" id="chatForm">
      <input type="text" id="userInput" placeholder="Ej: ¿Cómo veo las IP de mi red?" required autocomplete="off">
      <button type="submit" id="sendBtn">Enviar</button>
    </form>
  </div>

  <script src="./../static/script.js"></script>
</body>
</html>
